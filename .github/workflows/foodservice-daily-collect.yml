name: Daily foodservice trend collection

# §24 — 매일 09:00 KST = 00:00 UTC
# RSS 를 수집·분석해 collected.json 을 갱신하고 커밋한다.
# 커밋이 생기면 Vercel 자동 배포가 걸리면서 사이트 데이터가 바뀐다.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'AI 분석 없이(영문만) 수집된 결과도 커밋'
        type: boolean
        default: false

concurrency:
  group: daily-collect
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: 10-projects/34-외식트렌드/global-foodservice-trend-dashboard

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 10-projects/34-외식트렌드/global-foodservice-trend-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Collect and analyze articles
        env:
          # 키가 있으면 한국어 제목·3줄 요약·시사점까지 생성된다.
          # 없으면 규칙 기반(영문 원문 인용)으로 동작한다.
          AI_PROVIDER: ${{ secrets.ANTHROPIC_API_KEY != '' && 'claude' || 'none' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 저장소 Variables 에서 모델·수집량을 바꿀 수 있다 (비용 조절용).
          #   Settings → Secrets and variables → Actions → Variables 탭
          #   ANTHROPIC_MODEL        : claude-haiku-4-5 로 바꾸면 비용이 크게 내려간다
          #   COLLECT_MAX_PER_SOURCE : 소스당 수집 건수 (기본 20 → 11개 소스 약 220건/일)
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          COLLECT_MAX_PER_SOURCE: ${{ vars.COLLECT_MAX_PER_SOURCE || '20' }}
        run: npx tsx scripts/collect-to-file.ts

      - name: Check analysis quality
        id: quality
        run: |
          analyzer=$(node -p "require('./src/lib/data/collected.json').analyzer || 'none'")
          count=$(node -p "require('./src/lib/data/collected.json').articles.length")
          echo "analyzer=$analyzer" >> "$GITHUB_OUTPUT"
          echo "count=$count"       >> "$GITHUB_OUTPUT"
          echo "수집 $count건 / analyzer=$analyzer"

      - name: Commit updated dataset
        env:
          ANALYZER: ${{ steps.quality.outputs.analyzer }}
          COUNT: ${{ steps.quality.outputs.count }}
          FORCE: ${{ inputs.force_commit }}
        run: |
          if [ "$COUNT" = "0" ]; then
            echo "::warning::수집된 기사가 없어 커밋하지 않습니다."
            exit 0
          fi
          # 번역 없는 결과로 대시보드를 덮어쓰지 않는다 (수동 실행 시 force 로 우회 가능)
          if [ "$ANALYZER" = "rule-based" ] && [ "$FORCE" != "true" ]; then
            echo "::warning::ANTHROPIC_API_KEY 미설정 — 한국어 번역이 없어 커밋을 건너뜁니다."
            echo "::warning::저장소 Settings → Secrets → Actions 에 ANTHROPIC_API_KEY 를 추가하세요."
            exit 0
          fi
          if git diff --quiet -- src/lib/data/collected.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/collected.json
          git commit -m "chore(34-외식트렌드): 기사 자동 수집 $(date -u +'%Y-%m-%d') (${COUNT}건, ${ANALYZER})"
          git push
