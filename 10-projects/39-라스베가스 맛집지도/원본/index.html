<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라스베가스 맛집 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#14181f; --muted:#5d6675; --line:#e3e6eb;
  --accent:#0B63CE; --navy:#0F2F54; --star:#d4351c; --chip:#eef1f5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#161b22; --ink:#e8ecf1; --muted:#97a1b0; --line:#2a313b;
    --accent:#4c9bff; --navy:#9cc3ff; --star:#ff6b55; --chip:#202733;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b22; --ink:#e8ecf1; --muted:#97a1b0; --line:#2a313b;
  --accent:#4c9bff; --navy:#9cc3ff; --star:#ff6b55; --chip:#202733;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px}
header{padding:16px 20px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;font-weight:900;color:var(--navy);letter-spacing:-.3px}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kpi{background:var(--chip);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted)}
.kpi b{color:var(--ink);font-size:15px;margin-right:3px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{background:var(--navy);color:var(--panel);border-color:var(--navy)}
:root[data-theme="dark"] .chip.on{color:#0e1116}
select,input[type=search]{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 9px;font-family:inherit;font-size:12px}
input[type=search]{min-width:160px;flex:1;max-width:260px}
main{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - var(--hh,190px))}
#list{overflow-y:auto;border-right:1px solid var(--line);background:var(--bg);padding:10px}
#map{height:100%;background:var(--chip)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.card:hover,.card.sel{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .nm{font-weight:700;font-size:15px}
.card .num{display:inline-flex;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:6px;flex:none}
.yelp{color:var(--star);font-weight:700;white-space:nowrap;font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:12px;margin-top:6px}
.meta span b{color:var(--ink);font-weight:500}
.sig{margin-top:6px;font-size:12.5px}
.sig::before{content:"시그니처 · ";color:var(--accent);font-weight:700}
.tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;background:var(--chip);color:var(--muted);padding:2px 7px;border-radius:4px}
.approx{font-size:10.5px;color:var(--star)}
.leaflet-popup-content{font-family:"Noto Sans KR",sans-serif;font-size:12.5px;line-height:1.55;margin:12px 14px}
.pp h3{margin:0 0 4px;font-size:15px}
.pp a{color:#0B63CE;text-decoration:none;font-weight:700;margin-right:10px}
.mk{border-radius:50%;color:#fff;font:700 10px/22px "Noto Sans KR",sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.zone-label{background:none;border:none;box-shadow:none;color:#0F2F54;font:900 12px "Noto Sans KR",sans-serif;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.basetiles{filter:saturate(.55) brightness(1.03)}
.darkmap .basetiles{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.5)}
footer{font-size:11px;color:var(--muted);padding:8px 20px;background:var(--panel);border-top:1px solid var(--line)}
footer a{color:var(--accent)}
#themeBtn{margin-left:auto}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}
  #map{order:-1;height:55vh}
  #list{border-right:none;overflow:visible}
  header{padding:14px 16px 10px}
  #list{padding:10px 16px}
}
</style>
</head>

<header id="hdr">
  <h1>라스베가스 맛집 지도</h1>
  <div class="sub">인스타그램 추천 게시물 8건에서 뽑은 식당 69곳 · 카테고리 · 1인 객단가 · 영업시간 · 시그니처 메뉴 · Yelp 평점</div>
  <div class="kpis" id="kpis"></div>
  <div class="controls">
    <div class="chips" id="cats"></div>
  </div>
  <div class="controls">
    <select id="area"></select>
    <select id="price">
      <option value="">객단가 전체</option>
      <option value="1">$ (~$25)</option>
      <option value="2">$$ ($25–60)</option>
      <option value="3">$$$ ($60–130)</option>
      <option value="4">$$$$ ($130~)</option>
    </select>
    <select id="sort">
      <option value="yelp">Yelp 평점순</option>
      <option value="p-asc">객단가 낮은순</option>
      <option value="p-desc">객단가 높은순</option>
      <option value="name">이름순</option>
    </select>
    <input type="search" id="q" placeholder="식당·메뉴 검색">
    <button class="chip" id="themeBtn" type="button">◐ 테마</button>
  </div>
</header>
<main>
  <div id="list"></div>
  <div id="map"></div>
</main>
<footer>
  ⚠️ 객단가·영업시간·Yelp 평점은 2026-11 기준 <b>참고용 추정치</b>입니다(시즌·요일마다 달라짐). 방문 전 카드 안의 Yelp·구글맵 링크로 꼭 확인하세요. <span class="approx">◆ 좌표 근사</span> 표시는 대략적인 위치예요.

</footer>

const st = {cats:new Set(), area:"", price:"", sort:"yelp", q:"", sel:null};
const $ = s=>document.querySelector(s);
R.forEach((r,i)=>r.id=i);

// KPIs
const avg = (R.reduce((a,r)=>a+r.y,0)/R.length).toFixed(2);
$("#kpis").innerHTML = `<div class="kpi"><b>${R.length}</b>곳</div><div class="kpi"><b>${Object.keys(CATS).length}</b>개 카테고리</div><div class="kpi">평균 Yelp <b>★${avg}</b></div><div class="kpi">미쉐린 셀렉티드 <b>${R.filter(r=>r.src.includes("S3")).length}</b>곳</div>`;
$("#srcs").innerHTML = Object.values(SRC).map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${s.n}</a>`).join(" · ");

// category chips
const catBox = $("#cats");
function chipHTML(){
  catBox.innerHTML = `<button class="chip ${st.cats.size?"":"on"}" data-c="">전체</button>` +
    Object.entries(CATS).map(([k,v])=>`<button class="chip ${st.cats.has(k)?"on":""}" data-c="${k}"><span class="dot" style="background:${v.c}"></span>${v.n} ${R.filter(r=>r.c===k).length}</button>`).join("");
}
catBox.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const c=b.dataset.c;
  if(!c) st.cats.clear(); else st.cats.has(c)?st.cats.delete(c):st.cats.add(c);
  chipHTML(); render();
});
chipHTML();

const areas=[...new Set(R.map(r=>r.a))].sort();
$("#area").innerHTML = `<option value="">지역 전체</option>`+areas.map(a=>`<option>${a}</option>`).join("");
$("#area").onchange=e=>{st.area=e.target.value;render()};
$("#price").onchange=e=>{st.price=e.target.value;render()};
$("#sort").onchange=e=>{st.sort=e.target.value;render()};
$("#q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};

// Map
const map = L.map("map",{zoomControl:true}).setView([36.135,-115.20],12);
const tiles = {
  light: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  dark: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
};
let tl;
function isDark(){
  const t=document.documentElement.dataset.theme;
  if(t) return t==="dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function setTiles(){
  if(tl) map.removeLayer(tl);
  document.getElementById("map").classList.toggle("darkmap",isDark());
  tl=L.tileLayer(isDark()?tiles.dark:tiles.light,{maxZoom:19,className:"basetiles",attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
}
setTiles();
$("#themeBtn").onclick=()=>{
  document.documentElement.dataset.theme = isDark()?"light":"dark";
  try{localStorage.setItem("lvmap-theme",document.documentElement.dataset.theme)}catch(e){}
  setTiles();
};
try{const t=localStorage.getItem("lvmap-theme"); if(t){document.documentElement.dataset.theme=t;setTiles();}}catch(e){}

// Strip line + zone labels
L.polyline([[36.0905,-115.1745],[36.1020,-115.1727],[36.1150,-115.1725],[36.1260,-115.1680],[36.1365,-115.1625],[36.1475,-115.1560]],{color:"#0B63CE",weight:6,opacity:.25}).addTo(map);
const zones=[["더 스트립",36.1150,-115.1650],["차이나타운 (Spring Mtn Rd)",36.1345,-115.2080],["다운타운 · 아트디스트릭트",36.1640,-115.1460],["서머린",36.1650,-115.3150],["남서부",36.0700,-115.2650],["북서부 · Desert Shores",36.2250,-115.2550]];
zones.forEach(([t,a,b])=>L.marker([a,b],{icon:L.divIcon({className:"zone-label",html:t,iconSize:null}),interactive:false}).addTo(map));

const layer=L.layerGroup().addTo(map);
const markers={};
const priceTxt=p=>"$".repeat(p);
const yelpUrl=r=>"https://www.yelp.com/search?find_desc="+encodeURIComponent(r.n)+"&find_loc="+encodeURIComponent("Las Vegas, NV");
const gmapUrl=r=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.n+" Las Vegas");
function stars(y){return "★"+y.toFixed(1)}

function filtered(){
  let a=R.filter(r=>
    (!st.cats.size||st.cats.has(r.c)) &&
    (!st.area||r.a===st.area) &&
    (!st.price||r.p==st.price) &&
    (!st.q||(r.n+" "+r.s+" "+r.l+" "+CATS[r.c].n).toLowerCase().includes(st.q)));
  const s=st.sort;
  a.sort((x,y)=> s==="yelp"?y.y-x.y||x.p-y.p : s==="p-asc"?x.p-y.p||y.y-x.y : s==="p-desc"?y.p-x.p||y.y-x.y : x.n.localeCompare(y.n));
  return a;
}

function popup(r){
  return `<div class="pp"><h3>${r.n}</h3>
  <div><span style="color:${CATS[r.c].c};font-weight:700">${CATS[r.c].n}</span> · ${r.a}</div>
  <div>📍 ${r.l}${r.ap?' <span class="approx">◆좌표 근사</span>':''}</div>
  <div>💵 1인 ${r.pp} (${priceTxt(r.p)})</div>
  <div>🕒 ${r.h}</div>
  <div>⭐ Yelp <b style="color:#d4351c">${stars(r.y)}</b></div>
  <div>🍽 ${r.s}</div>
  <div style="margin-top:6px"><a href="${yelpUrl(r)}" target="_blank" rel="noopener">Yelp</a><a href="${gmapUrl(r)}" target="_blank" rel="noopener">구글맵</a></div></div>`;
}

function render(){
  const a=filtered();
  layer.clearLayers();
  const list=$("#list");
  list.innerHTML = a.length?"":`<div class="card">조건에 맞는 식당이 없어요.</div>`;
  a.forEach((r,i)=>{
    const col=CATS[r.c].c;
    const m=L.marker(r.ll,{icon:L.divIcon({className:"",html:`<div class="mk" style="background:${col};width:24px;height:24px">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-10]})}).bindPopup(popup(r));
    m.on("click",()=>selectCard(r.id,false));
    m.addTo(layer); markers[r.id]=m;
    const d=document.createElement("div");
    d.className="card"; d.dataset.id=r.id;
    d.innerHTML=`<div class="top"><div style="display:flex;align-items:flex-start"><span class="num" style="background:${col}">${i+1}</span><span class="nm">${r.n}</span></div><span class="yelp">Yelp ${stars(r.y)}</span></div>
      <div class="meta"><span style="color:${col};font-weight:700">${CATS[r.c].n}</span><span>💵 <b>${r.pp}</b> ${priceTxt(r.p)}</span><span>📍 ${r.a}</span></div>
      <div class="meta"><span>🕒 ${r.h}</span></div>
      <div class="sig">${r.s}</div>
      <div class="tags">${r.src.map(s=>`<span class="tag">${SRC[s].n}</span>`).join("")}${r.ap?'<span class="approx">◆좌표 근사</span>':''}</div>`;
    d.onclick=()=>selectCard(r.id,true);
    list.appendChild(d);
  });
}
function selectCard(id,fly){
  document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel"));
  const c=document.querySelector(`.card[data-id="${id}"]`);
  if(c){c.classList.add("sel"); if(!fly) c.scrollIntoView({behavior:"smooth",block:"nearest"});}
  const m=markers[id]; if(!m) return;
  if(fly){ map.flyTo(m.getLatLng(),15,{duration:.6}); setTimeout(()=>m.openPopup(),650); if(innerWidth<=860) document.getElementById("map").scrollIntoView({behavior:"smooth"}); }
}
function fitHeader(){document.documentElement.style.setProperty("--hh",(document.getElementById("hdr").offsetHeight+40)+"px");map.invalidateSize();}
addEventListener("resize",fitHeader);
render(); fitHeader();
</script>
